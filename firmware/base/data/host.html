<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Bowl Host</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --text:#1b1f24; --muted:#6b7380; --line:#dde1e6; --accent:#1f6fd1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --panel:#171b22; --text:#f2f4f8; --muted:#8b94a3; --line:#2a303a; --accent:#5aa0f2; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h1 { font-size:20px; margin:4px 0 0; } h2 { font-size:15px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  #buzz { font-size:24px; font-weight:700; margin-bottom:12px; min-height:30px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button { font:inherit; font-size:16px; padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; flex:1 1 auto; }
  button.good { background:#2a9d8f; color:#fff; border:0; } button.power { background:#e9c46a; color:#111; border:0; }
  button.bad { background:#e63946; color:#fff; border:0; } button:disabled { opacity:.4; cursor:default; }
  .team { display:grid; grid-template-columns:40px 1fr 70px auto; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .team:first-of-type { border-top:0; }
  input[type=text] { font:inherit; font-size:17px; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); width:100%; }
  input[type=color] { width:40px; height:40px; border:0; padding:0; background:none; }
  .score { font-size:20px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
  .adj button { padding:8px 10px; font-size:14px; }
  .hint { color:var(--muted); font-size:13px; margin-top:8px; }
  #status { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <header><h1>Quiz Bowl Host</h1><div id="status">Connecting…</div></header>
  <section>
    <h2>Question <span id="q">1</span></h2>
    <div id="buzz">Not armed</div>
    <div class="row">
      <button id="arm">Arm</button>
      <button class="good" data-pts="10">Correct +10</button>
      <button class="power" data-pts="15">Power +15</button>
      <button class="bad" data-pts="-5">Neg −5</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="wrong">Wrong (no neg)</button><button id="cont">Continue</button><button id="reset">Next question</button><button id="undo">Undo</button>
    </div>
  </section>
  <section>
    <h2>Teams</h2>
    <div id="teams"></div>
    <div class="hint">Names and colours save as you type and show on the scoreboard right away. Up to 24 characters.</div>
  </section>
  <section>
    <h2>Scoreboard</h2>
    <a id="boardLink" href="board.html" target="_blank">Open scoreboard</a>
  </section>
</main>
<script>
// Host view for the base station (served at /). Sends commands over WebSocket /ws:
//   {"type":"arm"} {"type":"award","points":10|15|-5} {"type":"wrong"} {"type":"continue"} {"type":"next"} {"type":"undo"}
//   {"type":"setTeam","id":1,"name":"Eagles","color":"#e63946"}   (base saves to flash)
//   {"type":"adjust","id":1,"points":5}
// Receives the same {"type":"state",...} message as board.html.
// ?demo runs without hardware: state lives in this page and is shared with board.html?demo in the same browser.
const demo = new URLSearchParams(location.search).has('demo');
const $ = id => document.getElementById(id);
let state = null, send;

function render() {
  const s = state; $('q').textContent = s.question;
  const b = s.buzz && s.teams.find(t => t.id === s.buzz.team);
  $('buzz').textContent = b ? `${b.name}${s.buzz.player ? ' · ' + s.buzz.player : ''}` : (s.armed ? 'Armed, waiting for a buzz' : 'Not armed');
  document.querySelectorAll('[data-pts], #wrong').forEach(x => x.disabled = !b);
  const box = $('teams');
  s.teams.forEach(t => {
    let el = box.querySelector(`[data-id="${t.id}"]`);
    if (!el) {
      el = document.createElement('div'); el.className = 'team'; el.dataset.id = t.id;
      el.innerHTML = `<input type="color"><input type="text" maxlength="24"><div class="score"></div>
        <div class="adj row"><button data-a="-5">−5</button><button data-a="5">+5</button></div>`;
      el.querySelector('input[type=text]').addEventListener('input', e => send({ type: 'setTeam', id: t.id, name: e.target.value.trim() || `Team ${t.id}` }));
      el.querySelector('input[type=color]').addEventListener('input', e => send({ type: 'setTeam', id: t.id, color: e.target.value }));
      el.querySelectorAll('[data-a]').forEach(x => x.onclick = () => send({ type: 'adjust', id: t.id, points: +x.dataset.a }));
      box.appendChild(el);
    }
    const name = el.querySelector('input[type=text]');
    if (document.activeElement !== name) name.value = t.name;
    el.querySelector('input[type=color]').value = t.color;
    el.querySelector('.score').textContent = t.score;
    el.style.opacity = t.locked ? .5 : 1;
  });
}

$('arm').onclick = () => send({ type: 'arm' });
document.querySelectorAll('[data-pts]').forEach(x => x.onclick = () => send({ type: 'award', points: +x.dataset.pts }));
$('wrong').onclick = () => send({ type: 'wrong' });
$('cont').onclick = () => send({ type: 'continue' });
$('reset').onclick = () => send({ type: 'next' });
$('undo').onclick = () => send({ type: 'undo' });

if (!demo) {
  (function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    send = m => ws.readyState === 1 && ws.send(JSON.stringify(m));
    ws.onopen = () => $('status').textContent = 'Connected';
    ws.onmessage = e => { try { const m = JSON.parse(e.data); if (m.type === 'state') { state = m; render(); } } catch {} };
    ws.onclose = () => { $('status').textContent = 'Reconnecting…'; setTimeout(connect, 1500); };
  })();
} else {
  // Demo: this page plays the base station. A fake buzz arrives 1.5 s after Arm.
  $('status').textContent = 'Demo mode: no hardware. Open the scoreboard link to see changes live.';
  $('boardLink').href = 'board.html?demo';
  const ch = new BroadcastChannel('qb-demo'), history = [];
  state = { question: 1, armed: false, buzz: null, teams: [
    { id: 1, name: 'Team 1', score: 0, color: '#e63946' }, { id: 2, name: 'Team 2', score: 0, color: '#4a90d9' },
    { id: 3, name: 'Team 3', score: 0, color: '#2a9d8f' }, { id: 4, name: 'Team 4', score: 0, color: '#f4a261' } ] };
  const publish = () => { render(); ch.postMessage({ type: 'state', ...state }); };
  ch.onmessage = e => e.data === 'hello' && publish();
  const team = id => state.teams.find(t => t.id === id);
  send = m => {
    if (['award', 'adjust', 'next'].includes(m.type)) history.push(JSON.stringify(state));
    switch (m.type) {
      case 'setTeam': Object.assign(team(m.id), m.name !== undefined ? { name: m.name } : {}, m.color ? { color: m.color } : {}); break;
      case 'adjust': team(m.id).score += m.points; break;
      case 'arm': case 'continue':
        state.armed = true; state.buzz = null;
        setTimeout(() => { const open = state.teams.filter(t => !t.locked); if (state.armed && open.length) {
          const t = open[Math.floor(Math.random() * open.length)]; state.buzz = { team: t.id, player: 'Seat ' + (1 + Math.floor(Math.random() * 4)) }; state.armed = false; publish(); } }, 1500);
        break;
      case 'award': if (state.buzz) { team(state.buzz.team).score += m.points; if (m.points < 0) team(state.buzz.team).locked = true; else nextQ(); } break;
      case 'wrong': if (state.buzz) { team(state.buzz.team).locked = true; state.buzz = null; } break;
      case 'next': nextQ(); break;
      case 'undo': if (history.length) state = JSON.parse(history.pop()); break;
    }
    publish();
  };
  function nextQ() { state.question++; state.buzz = null; state.armed = false; state.teams.forEach(t => t.locked = false); }
  publish();
}
</script>
</body>
</html>
